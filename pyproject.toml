[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyrag"
version = "0.2.0"
description = "A modular, multi-paradigm Retrieval-Augmented Generation (RAG) framework supporting Vector, Agentic, and Graph RAG architectures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Nguyen Viet Ky Quan", email = "nguyenvietkyquan2022@gmail.com" },
]
maintainers = [
    { name = "Nguyen Viet Ky Quan", email = "nguyenvietkyquan2022@gmail.com" },
]
keywords = ["rag", "polyrag", "agentic-rag", "graphrag", "vector-search", "embeddings", "react", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "langchain-core>=0.2.0",
    "langchain-text-splitters>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/NVKQ2022/PolyRAG"
Repository = "https://github.com/NVKQ2022/PolyRAG"
"Bug Tracker" = "https://github.com/NVKQ2022/PolyRAG/issues"
Documentation = "https://github.com/NVKQ2022/PolyRAG#readme"

[project.optional-dependencies]
openai = [
    "langchain-openai>=0.1.0",
]
chroma = [
    "langchain-chroma>=0.1.0",
]
milvus = [
    "langchain-milvus>=0.1.0",
]
huggingface = [
    "langchain-huggingface>=0.1.0",
]
community = [
    "langchain-community>=0.2.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
]
all = [
    "langchain-openai>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-milvus>=0.1.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyrag*"]

[tool.setuptools.package-data]
polyrag = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
