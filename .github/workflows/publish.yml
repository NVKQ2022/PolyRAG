name: Publish to PyPI 🚀

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository (pypi or testpypi)"
        required: true
        type: choice
        default: "pypi"
        options:
          - pypi
          - testpypi
      skip_tests:
        description: "Skip running tests before publishing (use with caution)"
        type: boolean
        default: false
        required: false

jobs:
  test:
    name: Test across Python versions
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[all,dev]

      - name: Run test suite
        run: |
          pytest tests/

  build:
    name: Build Distribution Packages
    needs: [test]
    if: always() && (needs.test.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & validation tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify package integrity
        run: |
          twine check dist/*

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polyrag-dist
          path: dist/
          retention-days: 5

  publish:
    name: Publish to Package Index
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Enables PyPI Trusted Publishing (OIDC)

    steps:
      - name: Retrieve distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: polyrag-dist
          path: dist/

      - name: Upload to Official PyPI
        if: github.event.inputs.target == 'pypi' || !github.event.inputs.target
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN || secrets.PYPI_API_TOKEN }}
